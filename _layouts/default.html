<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.lead | default: site.description }}">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6f3ed">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body class="home-page">
  <a class="skip" href="#main">Skip to content</a>
  <canvas id="grain-bg" class="grain-bg" aria-hidden="true"></canvas>
  <div class="wrap">
    <header>
      <nav class="site-nav" aria-label="Site">
        <a href="{{ '/' | relative_url }}" aria-current="page">{{ site.title }}</a>
      </nav>
    </header>
    <main id="main">
      {{ content }}
    </main>
    <footer class="site">{{ site.title }}</footer>
  </div>
  <script src="{{ '/assets/js/grain.js' | relative_url }}"></script>
</body>
</html>
