title: Uday
description: Applied research at the intersection of advanced AI, human-centric design, and AI safety. I want models that stay interpretable as they get more capable.
url: "https://udapy.github.io"
baseurl: ""
markdown: kramdown
kramdown:
  input: GFM
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..3
  smart_quotes: lsquo,rsquo,ldquo,rdquo
permalink: pretty
collections:
  notes:
    output: true
    permalink: /notes/:name/
defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: primer
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - README.md
  - WRITING.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - templates
  - vendor/bundle
  - .cursor
  - .github
  - _preview
